plugins {
    id 'gg.essential.multi-version'
    id 'gg.essential.defaults'
}

loom.serverOnlyMinecraftJar()

repositories {
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://maven.nucleoid.xyz' }
}

def commonProject = rootProject.project(":common")

dependencies {
    modImplementation include("net.kyori:adventure-platform-fabric:${fabric_adventure_platform_version}")
    modImplementation include("me.lucko:fabric-permissions-api:${fabric_permissions_api_version}")
    modImplementation include("eu.pb4:sgui:${fabric_sgui_version}")
    modImplementation include("net.william278.uniform:uniform-fabric:1.4.0+${findProperty('fabric_uniform_minecraft_version') ?: project.name}")
    modImplementation include("net.william278.toilet:toilet-fabric:1.1.2+${findProperty('fabric_toilet_minecraft_version') ?: project.name}")
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Manually include config deps due to the way including api deps works
    implementation include("de.exlll:configlib-core:4.8.1")
    implementation include("org.snakeyaml:snakeyaml-engine:3.2")
    implementation include('org.apache.commons:commons-pool2:2.13.1')

    // Include driver deps due to no runtime dep loading support
    implementation include("com.mysql:mysql-connector-j:$mysql_driver_version")
    implementation include("org.postgresql:postgresql:$postgres_driver_version")
    implementation include("org.mariadb.jdbc:mariadb-java-client:$mariadb_driver_version")
    implementation include("org.mongodb:mongodb-driver-sync:$mongodb_driver_version") // MongoDB dep
    implementation include("org.mongodb:mongodb-driver-core:$mongodb_driver_version") // MongoDB dep
    implementation include("org.mongodb:bson-record-codec:$mongodb_driver_version") // MongoDB dep
    implementation include("org.mongodb:bson:$mongodb_driver_version") // MongoDB dep
    implementation include("org.xerial.snappy:snappy-java:$snappy_version")
    implementation include("io.lettuce:lettuce-core:$lettuce_version")
    implementation include("redis.clients.authentication:redis-authx-core:0.2.0") // Redis dep
    implementation include('org.apache.commons:commons-pool2:2.13.1') // Redis dep
    implementation include("io.projectreactor:reactor-core:3.6.6") // Redis dep required by Lettuce at runtime
    implementation include("org.reactivestreams:reactive-streams:1.0.4") // Redis dep required by reactor-core

    compileOnly 'net.william278:DesertWell:2.0.4'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    compileOnly 'org.projectlombok:lombok:1.18.42'

    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation include(project(path: ":common"))
    commonProject.configurations.api.dependencies.each { dependency ->
        include(dependency)
    }
}

processResources {
    filesMatching(Arrays.asList("fabric.mod.json", "compatibility.yml")) {
        expand([
                version: version,
                fabric_loader_version: fabric_loader_version,
                fabric_minecraft_version: project.name,
                minecraft_version_range: minecraft_version_range
        ])
    }
}

shadowJar {
    from rootProject.file('LICENSE')
    configurations = [project.configurations.shadow]
    destinationDirectory.set(file("$projectDir/build/libs"))

    exclude('net.fabricmc:.*')
    exclude('net.kyori:.*')
    exclude '/mappings/*'
}

if (project.unobfuscated) {
    // Loom doesn't remap unobfuscated Minecraft versions
    jar {
        destinationDirectory.set(file("$rootDir/target/"))
        archiveClassifier.set('')
    }
} else {
    remapJar {
        dependsOn tasks.shadowJar
        mustRunAfter tasks.shadowJar
        inputFile = shadowJar.archiveFile.get()
        addNestedDependencies = true

        destinationDirectory.set(file("$rootDir/target/"))
        archiveClassifier.set('')
    }

    remapSourcesJar {
        destinationDirectory.set(file("$rootDir/target/"))
    }

    shadowJar.finalizedBy(remapJar)
}