plugins {
    id 'java'
    id 'net.william278.preprocessor' version '1.0'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
    id 'maven-publish'
}

dependencies {
    implementation project(path: ':common')

    implementation 'net.william278.uniform:uniform-bukkit:1.3.9'
    implementation 'net.william278.uniform:uniform-paper:1.3.9'
    implementation 'net.william278.toilet:toilet-bukkit:1.1.2'
    implementation 'net.william278:mpdbdataconverter:1.0.1'
    implementation 'net.william278:hsldataconverter:1.0'
    implementation 'net.william278:mapdataapi:2.0'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'net.kyori:adventure-platform-bukkit:4.4.1'
    implementation 'dev.triumphteam:triumph-gui:3.1.13'
    implementation 'space.arim.morepaperlib:morepaperlib:0.4.4'
    implementation 'de.tr7zw:item-nbt-api:2.16.0'

    compileOnly "io.papermc.paper:paper-api:${paper_api_version}"
    compileOnly 'com.github.retrooper:packetevents-spigot:2.13.0'
    compileOnly 'com.github.dmulloy2:ProtocolLib:5.3.0'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    compileOnly 'commons-io:commons-io:2.22.0'
    compileOnly 'org.json:json:20250517'
    compileOnly 'de.exlll:configlib-yaml:4.8.1'
    compileOnly 'com.zaxxer:HikariCP:7.1.0'
    compileOnly 'net.william278:DesertWell:2.0.4'
    compileOnly 'net.william278:AdvancementAPI:97a9583413'
    compileOnly "redis.clients:jedis:$jedis_version"

    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

processResources {
    filesMatching(['**/*.json', '**/*.yml']) {
        expand([
                version: version,
                paper_api_version: paper_api_version,
                minecraft_version: project.name,
                minecraft_version_range: minecraft_version_range,
                minecraft_api_version: minecraft_api_version
        ])
    }
}

sourceSets.main {
    java.srcDirs '../src/main/java'
    resources.srcDirs '../src/main/resources'
}
javadoc.setSource('./build/generated/preprocessed/main/java')

preprocess {
    vars.put('MC', minecraft_version_numeric)
}

shadowJar {
    dependencies {
        exclude(dependency('com.mojang:brigadier'))
    }

    relocate 'org.apache.commons.io', 'net.william278.husksync.libraries.commons.io'
    relocate 'org.apache.commons.text', 'net.william278.husksync.libraries.commons.text'
    relocate 'org.apache.commons.lang3', 'net.william278.husksync.libraries.commons.lang3'
    relocate 'com.google.gson', 'net.william278.husksync.libraries.gson'
    relocate 'com.fatboyindustrial', 'net.william278.husksync.libraries'
    relocate 'org.jetbrains', 'net.william278.husksync.libraries'
    relocate 'org.intellij', 'net.william278.husksync.libraries'
    relocate 'com.zaxxer', 'net.william278.husksync.libraries'
    relocate 'de.exlll', 'net.william278.husksync.libraries'
    relocate 'net.william278.uniform', 'net.william278.husksync.libraries.uniform'
    relocate 'net.william278.toilet', 'net.william278.husksync.libraries.toilet'
    relocate 'net.william278.desertwell', 'net.william278.husksync.libraries.desertwell'
    relocate 'net.william278.mapdataapi', 'net.william278.husksync.libraries.mapdataapi'
    relocate 'net.william278.mpdbconverter', 'net.william278.husksync.libraries.mpdbconverter'
    relocate 'net.william278.hslmigrator', 'net.william278.husksync.libraries.hslconverter'
    relocate 'org.json', 'net.william278.husksync.libraries.json'
    relocate 'net.querz', 'net.william278.husksync.libraries.nbtparser'
    relocate 'net.roxeez', 'net.william278.husksync.libraries'
    relocate 'org.bstats', 'net.william278.husksync.libraries.bstats'
    relocate 'dev.triumphteam.gui', 'net.william278.husksync.libraries.triumphgui'
    relocate 'space.arim.morepaperlib', 'net.william278.husksync.libraries.paperlib'
    relocate 'de.tr7zw.changeme.nbtapi', 'net.william278.husksync.libraries.nbtapi'

    minimize()
}

tasks {
    runServer {
        minecraftVersion(project.name)

        downloadPlugins {
            github("plan-player-analytics", "Plan", "5.6.2965", "Plan-5.6-build-2965.jar")
        }
    }
}

// XMine start - публикация в свой Reposilite
//
// Этот build.gradle общий на все версии букита (1.21.10, 1.21.11, 26.2, 26.1.2 -
// см. settings.gradle, buildFileName = '../build.gradle'), а нода тянет только
// сборку под 26.1.2 (XMineNode/plugins/common.yml, координата
// ru.xmine.thirdparty:husksync). Публиковать остальные версии незачем и не на чем
// проверить - поэтому блок целиком под условием project.name == '26.1.2', а не в
// корневом build.gradle, где такой развилки нет.
//
// Версия - настоящий maven-SNAPSHOT (xmine-publish.yml передаёт её через
// -PxmineVersion), а не собственная неизменяемая координата вроде
// LibertyBans/CoreProtect (<апстрим>-xmine.N): первый прогон стенда пойдёт на
// форке и правки нужны будут не раз, а SNAPSHOT-версию можно перезаливать по тому
// же адресу. Значение по умолчанию - для локального ./gradlew build без -P, чтобы
// сборка не падала на конфигурации.
if (project.name == '26.1.2') {
    def xmineVersion = providers.gradleProperty('xmineVersion').getOrElse('0.0.0-xmine-local-SNAPSHOT')

    publishing {
        publications {
            // Своя координата, не мешает апстримным mavenJavaBukkit_* публикациям
            // (net.william278.husksync:husksync-bukkit) - у них нет настроенных
            // repositories, поэтому publish-задачи для них даже не создаются
            // (проверено: ./gradlew :bukkit:26.1.2:tasks --group publishing до этой
            // правки показывает только publish/publishToMavenLocal без адреса).
            xmineThirdParty(MavenPublication) {
                groupId = 'ru.xmine.thirdparty'
                artifactId = 'husksync'
                version = xmineVersion

                artifact(shadowJar) {
                    // Задача уже собирает classifier '' (см. корневой build.gradle,
                    // subprojects.shadowJar), но без явного null Gradle всё равно
                    // может унаследовать классификатор из имени задачи - обнуляем,
                    // чтобы в координате не оказалось лишнего суффикса.
                    classifier = null
                }
            }
        }

        repositories {
            maven {
                name = 'xmine'
                // third-party - тот самый закрытый раздел, откуда фактически берёт
                // файл XMineNode (repo: third-party в plugins/common.yml).
                url = uri(providers.environmentVariable('XMINE_MAVEN_URL')
                        .getOrElse('https://maven.xmine.world/third-party'))
                credentials {
                    username = providers.environmentVariable('XMINE_MAVEN_USERNAME').orNull
                    password = providers.environmentVariable('XMINE_MAVEN_PASSWORD').orNull
                }
            }
        }
    }

    tasks.named('publishXmineThirdPartyPublicationToXmineRepository') {
        dependsOn(shadowJar)
    }
}
// XMine end - публикация в свой Reposilite
