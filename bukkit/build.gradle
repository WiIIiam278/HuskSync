import groovy.io.FileType

import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
    id 'maven-publish'
}

// One jar runs on every Minecraft version with a folder here. Each folder's gradle.properties gives the versions it
// covers, their Paper API and their Java version. Oldest first
def supportedVersions = projectDir.listFiles((FileFilter) ((File file) ->
        file.isDirectory() && file.name ==~ /(\d+)\.(\d+)(\.(\d+))?/))
        .collect { dir ->
            def properties = new Properties()
            dir.toPath().resolve('gradle.properties').withInputStream { properties.load(it) }
            [name: dir.name] + properties
        }
        .sort { it.name.tokenize('.')*.toInteger().with { (it[0] * 100 + it[1]) * 100 + (it[2] ?: 0) } }
def oldest = supportedVersions.first()
def javaVersions = supportedVersions.collect { it.java_version as int }

dependencies {
    implementation project(path: ':common')

    implementation 'net.william278.uniform:uniform-bukkit:1.4.0'
    implementation 'net.william278.uniform:uniform-paper:1.4.0'
    implementation 'net.william278.toilet:toilet-bukkit:1.1.2'
    implementation 'net.william278:mpdbdataconverter:1.0.1'
    implementation 'net.william278:hsldataconverter:1.0'
    implementation 'net.william278:mapdataapi:2.0'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'net.kyori:adventure-platform-bukkit:4.4.1'
    implementation 'dev.triumphteam:triumph-gui:3.1.13'
    implementation 'space.arim.morepaperlib:morepaperlib:0.4.4'
    implementation 'de.tr7zw:item-nbt-api:2.16.1'

    compileOnly "io.papermc.paper:paper-api:${oldest.paper_api_version}"
    compileOnly 'com.github.retrooper:packetevents-spigot:2.14.0'
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    compileOnly 'commons-io:commons-io:2.22.0'
    compileOnly 'org.json:json:20250517'
    compileOnly 'de.exlll:configlib-yaml:4.8.1'
    compileOnly 'com.zaxxer:HikariCP:7.1.0'
    compileOnly 'net.william278:DesertWell:2.0.4'
    compileOnly 'net.william278:AdvancementAPI:97a9583413'
    compileOnly "io.lettuce:lettuce-core:$lettuce_version"
    compileOnly "org.apache.commons:commons-pool2:$commons_pool_version"

    annotationProcessor 'org.projectlombok:lombok:1.18.42'
}

// Compiled against the oldest API, for the oldest Java, by a JDK that can read the newest API (see checkPaperApis)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersions.max())
    }
}
compileJava.options.release.set javaVersions.min()

processResources {
    def expansions = [
            version                : version.toString(),
            minecraft_version_range: supportedVersions*.minecraft_version_range.join(' || '),
            minecraft_api_version  : oldest.minecraft_api_version
    ]
    inputs.properties expansions
    filesMatching(['**/*.json', '**/*.yml']) {
        expand expansions
    }
}

shadowJar {
    dependencies {
        exclude(dependency('com.mojang:brigadier'))
    }

    relocate 'org.apache.commons.io', 'net.william278.husksync.libraries.commons.io'
    relocate 'com.google.gson', 'net.william278.husksync.libraries.gson'
    relocate 'com.fatboyindustrial', 'net.william278.husksync.libraries'
    relocate 'org.jetbrains', 'net.william278.husksync.libraries'
    relocate 'org.intellij', 'net.william278.husksync.libraries'
    relocate 'com.zaxxer', 'net.william278.husksync.libraries'
    relocate 'de.exlll', 'net.william278.husksync.libraries'
    relocate 'net.william278.uniform', 'net.william278.husksync.libraries.uniform'
    relocate 'net.william278.toilet', 'net.william278.husksync.libraries.toilet'
    relocate 'net.william278.desertwell', 'net.william278.husksync.libraries.desertwell'
    relocate 'net.william278.mapdataapi', 'net.william278.husksync.libraries.mapdataapi'
    relocate 'net.william278.mpdbconverter', 'net.william278.husksync.libraries.mpdbconverter'
    relocate 'net.william278.hslmigrator', 'net.william278.husksync.libraries.hslconverter'
    relocate 'org.json', 'net.william278.husksync.libraries.json'
    relocate 'net.querz', 'net.william278.husksync.libraries.nbtparser'
    relocate 'net.roxeez', 'net.william278.husksync.libraries'
    relocate 'org.bstats', 'net.william278.husksync.libraries.bstats'
    relocate 'dev.triumphteam.gui', 'net.william278.husksync.libraries.triumphgui'
    relocate 'space.arim.morepaperlib', 'net.william278.husksync.libraries.paperlib'
    relocate 'de.tr7zw.changeme.nbtapi', 'net.william278.husksync.libraries.nbtapi'

    minimize()
}

// The jar is also copied as HuskSync-Bukkit-<version>+mc.<Minecraft version>.jar for each supported version, the
// names each version's download on William278.net (see the CI workflows) and HuskNet go by
def versionedJars = tasks.register('versionedJars') {
    description = 'Copies the plugin jar for each supported Minecraft version'
    def jar = shadowJar.archiveFile
    def copies = supportedVersions.collect {
        file("$rootDir/target/${base.archivesName.get()}-$version+mc.${it.name}.jar")
    }
    inputs.file jar
    outputs.files copies
    doLast {
        copies.each { Files.copy(jar.get().asFile.toPath(), it.toPath(), StandardCopyOption.REPLACE_EXISTING) }
    }
}
assemble.dependsOn versionedJars

// The jar has to call every supported version's API in the same way, so the plugin is compiled against each one too,
// and must come out the same. It wouldn't if, say, a class changed from an enum to an interface (as Attribute did in
// Minecraft 1.21.3) or a method's signature changed, and the jar would then fail on those versions
def apiClassesDir = layout.buildDirectory.dir('paper-api')
def paperApiCompiles = supportedVersions.drop(1).collectEntries { minecraft ->
    def id = minecraft.name.replace('.', '_')
    def apiClasspath = configurations.create("paper${id}CompileClasspath") {
        description = "Compile classpath for the plugin against the Paper ${minecraft.name} API"
        canBeConsumed = false
        extendsFrom configurations.implementation, configurations.compileOnly
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.CLASSES))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                    objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, minecraft.java_version as int)
        }
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'io.papermc.paper' && details.requested.name == 'paper-api') {
                details.useVersion minecraft.paper_api_version
            }
        }
    }
    [(minecraft.name): tasks.register("compilePaper${id}Java", JavaCompile) {
        description = "Compiles the plugin against the Paper ${minecraft.name} API"
        source = sourceSets.main.java
        classpath = apiClasspath
        destinationDirectory.set apiClassesDir.map { it.dir(minecraft.name) }
        options.encoding = compileJava.options.encoding
        options.release.set compileJava.options.release
        options.annotationProcessorPath = sourceSets.main.annotationProcessorPath
    }]
}

def checkPaperApis = tasks.register('checkPaperApis') {
    description = 'Checks the plugin calls every supported Paper API in the same way'
    group = 'verification'
    def expectedDir = compileJava.destinationDirectory
    def apiDirs = paperApiCompiles.collectEntries { name, compile -> [(name): compile.flatMap { it.destinationDirectory }] }
    inputs.files compileJava, paperApiCompiles.values()
    doLast {
        def classesIn = { File dir ->
            def classes = [:]
            dir.eachFileRecurse(FileType.FILES) {
                if (it.name.endsWith('.class')) {
                    classes[dir.toPath().relativize(it.toPath()).toString()] = it.bytes
                }
            }
            return classes
        }
        def expected = classesIn(expectedDir.get().asFile)
        def mismatches = apiDirs.collectEntries { name, dir ->
            def actual = classesIn(dir.get().asFile)
            [(name): (expected.keySet() + actual.keySet()).findAll { !Arrays.equals(expected[it], actual[it]) }.sort()]
        }.findAll { it.value }
        if (mismatches) {
            throw new GradleException(([
                    "The plugin is compiled against the Paper ${oldest.name} API, but compiles differently against:",
                    *mismatches.collect { name, classes -> "  Paper $name: ${classes.join(', ')}".toString() },
                    'It has to call every supported version\'s API in the same way to run on all of them. To see how',
                    "they differ, compare the classes in ${expectedDir.get().asFile} and" +
                            " ${apiClassesDir.get().asFile}/<version> with `javap -c -p`."
            ]).join('\n'))
        }
    }
}
check.dependsOn checkPaperApis

tasks {
    // Runs a test server on the newest supported version, or another with -Pminecraft_version=1.21.8
    runServer {
        minecraftVersion(findProperty('minecraft_version') ?: supportedVersions.last().name)

        downloadPlugins {
            github("plan-player-analytics", "Plan", "5.6.2965", "Plan-5.6-build-2965.jar")
        }
    }
}
