name: CI Tests & Publish

on:
  push:
    branches: [ 'master' ]
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/**'
      - 'README.md'

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout for CI 🛎️'
        uses: actions/checkout@v7
      - name: 'Set up JDK 25 📦'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: 'Set up Gradle 📦'
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: 'Build with Gradle 🏗️'
        run: ./gradlew build test publish --build-cache
        env:
          SNAPSHOTS_MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          SNAPSHOTS_MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      - name: 'Publish Test Report 📊'
        uses: mikepenz/action-junit-report@v6
        if: success() || failure() # Continue on failure
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
      - name: 'Fetch Version Name 📝'
        run: |
          echo "version_name=$(./gradlew properties --no-daemon --console=plain -q | grep "^version:" | awk '{printf $2}')" >> "$GITHUB_ENV"
      - name: 'Publish to William278.net 🚀'
        uses: WiIIiam278/bones-publish-action@v1
        with:
          api-key: ${{ secrets.BONES_API_KEY }}
          project: 'husksync'
          channel: 'alpha'
          version: ${{ env.version_name }}
          changelog: ${{ github.event.head_commit.message }}
          distro-names: |
            fabric-1.21.1
            fabric-1.21.4
            fabric-1.21.5
            fabric-1.21.8
            fabric-1.21.10
            fabric-1.21.11
            fabric-26.1.2
            fabric-26.2
            fabric-26.3
            paper-1.21.1
            paper-1.21.4
            paper-1.21.5
            paper-1.21.8
            paper-1.21.10
            paper-1.21.11
            paper-26.1.2
            paper-26.2
            paper-26.3
          distro-groups: |
            fabric
            fabric
            fabric
            fabric
            fabric
            fabric
            fabric
            fabric
            fabric
            paper
            paper
            paper
            paper
            paper
            paper
            paper
            paper
            paper
          distro-descriptions: |
            Fabric 1.21.1
            Fabric 1.21.4
            Fabric 1.21.5
            Fabric 1.21.8
            Fabric 1.21.10
            Fabric 1.21.11
            Fabric 26.1.2
            Fabric 26.2
            Fabric 26.3
            Paper 1.21.1
            Paper 1.21.4
            Paper 1.21.5
            Paper 1.21.8
            Paper 1.21.10
            Paper 1.21.11
            Paper 26.1.2
            Paper 26.2
            Paper 26.3
          files: |
            target/HuskSync-Fabric-${{ env.version_name }}+mc.1.21.1.jar
            target/HuskSync-Fabric-${{ env.version_name }}+mc.1.21.4.jar
            target/HuskSync-Fabric-${{ env.version_name }}+mc.1.21.5.jar
            target/HuskSync-Fabric-${{ env.version_name }}+mc.1.21.8.jar
            target/HuskSync-Fabric-${{ env.version_name }}+mc.1.21.10.jar
            target/HuskSync-Fabric-${{ env.version_name }}+mc.1.21.11.jar
            target/HuskSync-Fabric-${{ env.version_name }}+mc.26.1.2.jar
            target/HuskSync-Fabric-${{ env.version_name }}+mc.26.2.jar
            target/HuskSync-Fabric-${{ env.version_name }}+mc.26.3.jar
            target/HuskSync-Bukkit-${{ env.version_name }}+mc.1.21.1.jar
            target/HuskSync-Bukkit-${{ env.version_name }}+mc.1.21.4.jar
            target/HuskSync-Bukkit-${{ env.version_name }}+mc.1.21.5.jar
            target/HuskSync-Bukkit-${{ env.version_name }}+mc.1.21.8.jar
            target/HuskSync-Bukkit-${{ env.version_name }}+mc.1.21.10.jar
            target/HuskSync-Bukkit-${{ env.version_name }}+mc.1.21.11.jar
            target/HuskSync-Bukkit-${{ env.version_name }}+mc.26.1.2.jar
            target/HuskSync-Bukkit-${{ env.version_name }}+mc.26.2.jar
            target/HuskSync-Bukkit-${{ env.version_name }}+mc.26.3.jar
